{% extends 'partials/base.html' %}
{% block title %}Home Page{% endblock %}

{% block content %}
{% comment %} <div class="container-fluid">
    <div class="row mt-2">
        <div class="col-md-6">
            <!-- Increase the height of the container -->
            <div id="map-container" style="height: 600px;">
                {{ map1 | safe }}
            </div>
        </div>
        <div class="col-md-6">
            <!-- Display user's current location -->
            <div id="current-location-info">
                <h3>Current Location:</h3>
                <p id="location"></p>
            </div>
        </div>
    </div>
</div>

<script>
    // Function to initialize the map
    function initMap() {
        // Check if geolocation is supported
        if (navigator.geolocation) {
            // Get current location
            navigator.geolocation.getCurrentPosition(function(position) {
                var latitude = position.coords.latitude;
                var longitude = position.coords.longitude;

                // Display the current location on the page
                document.getElementById('location').innerHTML = 'Latitude: ' + latitude + ', Longitude: ' + longitude;

                // Create map centered around the user's current location
                var map = L.map('map-container').setView([latitude, longitude], 16); // Adjust zoom level here

                // Add tile layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);

                // Add a marker for the current location
                L.marker([latitude, longitude]).addTo(map)
                    .bindPopup('Your Location')
                    .openPopup();
            });
        } else {
            // If geolocation is not supported, display a message
            alert('Geolocation is not supported by this browser.');
        }
    }

    // Call the initMap function when the page is loaded
    window.onload = initMap;
</script> {% endcomment %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Map</title>
    {{ map1|safe }}
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        let map = L.map('map').setView([15.48586000, 120.96648000], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        // Add the heatmap
        var heat_data = {{ heat_data|safe }};
        L.heatLayer(heat_data, {radius: 25}).addTo(map);

        // Add fullscreen control to the map
        L.control.fullscreen().addTo(map);

        let marker;

        function updateMarker(lat, lng) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map).bindPopup("Your Location").openPopup();
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    updateMarker(lat, lng);
                }, function(error) {
                    console.log("Geolocation error: " + error.message);
                }, {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                });
            } else {
                console.log("Geolocation is not supported by this browser.");
            }
        });
    </script>
</body>
</html>

{% endblock %}
