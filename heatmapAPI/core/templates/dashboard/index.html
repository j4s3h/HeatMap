{% block title %}Home Page{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mt-2">
        <div class="col-md-6">
            <!-- Increase the height of the container -->
            <div id="map-container" style="height: 600px;">
                <!-- Placeholder for the map -->
                {{ map1 | safe }}
            </div>
        </div>
        <div class="col-md-6">
            <!-- Display user's current location -->
            <div id="current-location-info">
                <h3>Current Location:</h3>
                <p id="location">Fetching location...</p>
            </div>
        </div>
    </div>
</div>

<!-- Include Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

<!-- Include Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<script>
    var map;
    var mapContainer = document.getElementById('map-container');

    function initMap() {
        // Check if geolocation is supported
        if (navigator.geolocation) {
            // Get current location
            navigator.geolocation.getCurrentPosition(function(position) {
                var latitude = position.coords.latitude;
                var longitude = position.coords.longitude;

                // Display the current location on the page
                document.getElementById('location').innerHTML = 'Latitude: ' + latitude + ', Longitude: ' + longitude;

                // Initialize the map centered on the current location
                map = L.map(mapContainer).setView([latitude, longitude], 14);

                // Add the tile layer (you can adjust this according to your needs)
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19
                }).addTo(map);

                // Add a marker for the user's current location
                L.marker([latitude, longitude]).addTo(map)
                    .bindPopup('You are here!')
                    .openPopup();

                // If you have heat data, you can add it here
                var heatData = {{ map1|safe }};
                L.heatLayer(heatData, { radius: 25 }).addTo(map);

            }, function() {
                // Handle errors
                alert('Unable to retrieve your location.');
            });
        } else {
            // If geolocation is not supported, display a message
            alert('Geolocation is not supported by this browser.');
        }
    }

    // Call the initMap function when the page is loaded
    window.onload = initMap;
</script>
{% endblock %}
